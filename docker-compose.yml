services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-decision_data}
      MYSQL_USER: ${DB_USERNAME:-decision_data}
      MYSQL_PASSWORD: ${DB_PASSWORD:-decision_data}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-decision_data}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-decision_data}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nota: `app`, `worker` y `scheduler` NO usan env_file apuntando a
  # backend/.env. Ese archivo es para desarrollo local sin Docker y puede
  # traer valores incompatibles (p. ej. sqlite en vez de mysql) — si se
  # cargara aquí, esas variables de entorno reales pisarían silenciosamente
  # al .env que el propio entrypoint genera DENTRO del contenedor a partir
  # de .env.example (que ya trae los hosts correctos de esta red: mysql,
  # redis). Nos pasó una vez: quedó corriendo con sqlite y cola `database`
  # sin que ningún log lo dejara obvio.
  #
  # Solo "app" corre migrate/seed (entrypoint.sh). worker y scheduler usan
  # entrypoint-worker.sh, que NO migra ni siembra: si los tres migraran en
  # paralelo compiten por las mismas tablas — nos pasó, un migrate:fresh de
  # un contenedor tumbó la tabla que el seeder de otro estaba leyendo a
  # mitad de camino, y ese contenedor murió sin nadie que lo reinicie.
  # `depends_on: app: condition: service_healthy` ya garantiza que app
  # terminó de migrar antes de que worker/scheduler arranquen siquiera.
  app:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 explícito: en Alpine "localhost" resuelve primero a ::1 y el
      # servidor de PHP solo escucha en IPv4, así que wget con "localhost" falla.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    entrypoint: ["/entrypoint-worker.sh"]
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    entrypoint: ["/entrypoint-worker.sh"]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
